        // Sound Magic (Web Audio API Glockenspiel)
        function playChimeSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.6);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.12);
                    osc.stop(ctx.currentTime + idx * 0.12 + 0.6);
                });
            } catch(e) {}

        // Setup Realtime Database Live Synchronization
        function initFirebaseSync() {
            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    dbRef = firebase.database().ref(`artifacts/${appId}/calendar`);

                    // Listen for LIVE changes in Realtime Database
                    dbRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && Array.isArray(data) && data.length > 0) {
                            calendarData = data;
                        } else {
                            // If empty, initialize DB with defaults
                            dbRef.set(DEFAULT_CALENDAR_DATA);
                            calendarData = [...DEFAULT_CALENDAR_DATA];
                        }
                        
                        isFirebaseConnected = true;
                        updateSyncBadge(true, "Live mit Firebase verbunden");
                        refreshUI();
                    }, (error) => {
                        console.warn("Firebase sync error, using local fallback:", error);
                        useLocalFallback();
                    });
                } else {
                    useLocalFallback();
                }
            } catch(e) {
                console.warn("Firebase initialization failed, using local fallback:", e);
                useLocalFallback();
            }
        }

        function useLocalFallback() {
            isFirebaseConnected = false;
            updateSyncBadge(false, "Lokaler Modus (Offline)");
            const saved = localStorage.getItem('stitch_adventskalender_data');
            if (saved) {
                try { calendarData = JSON.parse(saved); } catch(e) { calendarData = [...DEFAULT_CALENDAR_DATA]; }
            } else {
                calendarData = [...DEFAULT_CALENDAR_DATA];
            }
            refreshUI();
        }

                label.textContent = text;
            } else {
                dot.className = "w-2 h-2 rounded-full bg-amber-400";
                label.textContent = text;
            }
        }

            if (isFirebaseConnected && dbRef) {
                dbRef.set(calendarData).catch(err => {
                    console.error("Firebase save error:", err);
                    localStorage.setItem('stitch_adventskalender_data', JSON.stringify(calendarData));
                });
            } else {
                localStorage.setItem('stitch_adventskalender_data', JSON.stringify(calendarData));
            }
        }

        function handleCodeSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('codeInput');
            const code = input.value.trim();

            if (!code || code.length !== 5) {
                showFeedback("Bitte gib einen 5-stelligen Code ein!", "text-rose-400");
                return;
            }

            const match = calendarData.find(item => item.code.toLowerCase() === code.toLowerCase());

            if (match) {
                input.value = '';
                showFeedback(`✨ Code richtig! Starte Minispiel für Tag ${match.day}...`, "text-sky-300");
                setTimeout(() => {
                    openPuzzleModal(match.day);
                }, 500);
            } else {
                showFeedback("❌ Ungültiger Code. Überprüfe deinen 3D-Druck Kalender!", "text-rose-400");
            }
        }

                container.innerHTML = `
                    <p class="text-sm text-sky-200 font-medium mb-3">${item.prompt}</p>
                    <input type="text" id="quizInput" class="w-full bg-slate-900 border border-sky-800 rounded-xl px-4 py-2 text-white outline-none focus:border-sky-400 text-sm uppercase" placeholder="Deine Antwort eingeben...">
                `;
            } else if (item.gameType === 'unscramble') {
                const scrambled = item.answer.split('').sort(() => 0.5 - Math.random()).join('');
                activeGameData.userWord = [];
                activeGameData.target = item.answer;

                container.innerHTML = `
                    <p class="text-xs text-sky-200 mb-2">${item.prompt}</p>
                    <div id="wordDisplay" class="h-10 bg-slate-900 border border-sky-800 rounded-xl flex items-center justify-center gap-1 text-lg font-bold text-sky-300 font-mono tracking-widest mb-4">
                        _ _ _ _
                    </div>
                    <div id="letterButtons" class="flex flex-wrap justify-center gap-2">
                        ${scrambled.split('').map((char) => `
                            <button onclick="selectLetter('${char}', this)" class="w-10 h-10 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm shadow-md transition-all">
                                ${char}
                            </button>
                        `).join('')}
                    </div>
                    <button onclick="resetUnscramble()" class="mt-3 text-[11px] text-sky-400 hover:underline block mx-auto">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Zurücksetzen
                    </button>
                `;
                updateWordDisplay();
            } else if (item.gameType === 'catch') {
                const targetCount = parseInt(item.answer.replace('CATCH_', '')) || 4;
                activeGameData.caught = 0;
                activeGameData.target = targetCount;

                container.innerHTML = `
                    <p class="text-xs text-sky-200 mb-2">${item.prompt} (${activeGameData.caught}/${activeGameData.target})</p>
                    <div id="catchArea" class="h-40 bg-slate-900/90 border border-sky-800/60 rounded-xl relative overflow-hidden flex items-center justify-center">
                        <span class="text-xs text-slate-600">Sterne erscheinen...</span>
                    </div>
                `;
                spawnCatchItems();
            } else if (item.gameType === 'memory') {
                const icons = ['🌺', '🧪', '👑', '👽', '🏄', '⭐'].slice(0, 3);
                const deck = [...icons, ...icons].sort(() => 0.5 - Math.random());
                activeGameData.flipped = [];
                activeGameData.matched = 0;
                activeGameData.totalPairs = icons.length;

                container.innerHTML = `
                    <p class="text-xs text-sky-200 mb-3">${item.prompt}</p>
                    <div class="grid grid-cols-3 gap-2 max-w-xs mx-auto">
                        ${deck.map((icon, idx) => `
                            <button onclick="flipMemoryCard(${idx}, '${icon}', this)" class="h-14 rounded-xl bg-slate-900 border border-sky-800 text-2xl flex items-center justify-center transition-all hover:border-sky-400 memory-btn">
                                <span class="hidden icon-span">${icon}</span>
                                <span class="cover-span text-sky-400 text-sm">🌺</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (item.gameType === 'sequence') {
                const seq = item.sequence || ["🌺","🧪","👑"];
                activeGameData.seq = seq;
                activeGameData.userSeq = [];

                container.innerHTML = `
                    <p class="text-xs text-sky-200 mb-2">${item.prompt}</p>
                    <div id="seqTargetDisplay" class="flex justify-center gap-2 mb-4 p-3 bg-slate-900 rounded-xl border border-sky-800/60 text-2xl">
                        ${seq.map(s => `<span>${s}</span>`).join(' ')}
                    </div>
                    <div class="flex justify-center gap-2">
                        ${[...new Set(seq)].map(s => `
                            <button onclick="pressSequenceSymbol('${s}')" class="w-12 h-12 rounded-xl bg-sky-600/30 hover:bg-sky-500/40 border border-sky-400/30 text-2xl flex items-center justify-center transition-all">
                                ${s}
                            </button>
                        `).join('')}
                    </div>
                `;
            }
        }

        // Unscramble Helper
        function selectLetter(char, btn) {
            btn.disabled = true;
            btn.classList.add('opacity-30');
            activeGameData.userWord.push(char);
            updateWordDisplay();
        }

        function updateWordDisplay() {
            const display = document.getElementById('wordDisplay');
            if (display) {
                display.textContent = activeGameData.userWord.join('') || '_ _ _ _';
            }
        }

        function resetUnscramble() {
            const item = calendarData.find(d => d.day === activeDayForModal);
            if (item) setupGameUI(item);
        }

        // Catch Game Helper
        function spawnCatchItems() {
            const area = document.getElementById('catchArea');
            if (!area) return;
            area.innerHTML = '';

            const btn = document.createElement('button');
            btn.className = "absolute text-2xl animate-bounce transition-all transform hover:scale-125 p-2";
            btn.textContent = "⭐";
            
            const x = Math.random() * 80 + 10;
            const y = Math.random() * 70 + 15;
            btn.style.left = `${x}%`;
            btn.style.top = `${y}%`;

            btn.onclick = () => {
                activeGameData.caught++;
                if (activeGameData.caught >= activeGameData.target) {
                    activeGameData.solved = true;
                    document.getElementById('puzzleFeedback').textContent = "🎉 Alle Sterne gefangen!";
                    document.getElementById('puzzleFeedback').className = "text-xs font-semibold mb-4 text-emerald-400";
                    area.innerHTML = `<span class="text-sm text-emerald-400 font-bold">Geschafft!</span>`;
                } else {
                    spawnCatchItems();
                }
            };

            area.appendChild(btn);
        }

        // Memory Helper
        function flipMemoryCard(idx, icon, btn) {
            if (btn.classList.contains('matched') || activeGameData.flipped.length >= 2) return;

            btn.querySelector('.cover-span').classList.add('hidden');
            btn.querySelector('.icon-span').classList.remove('hidden');
            btn.classList.add('bg-sky-950', 'border-sky-400');

            activeGameData.flipped.push({ idx, icon, btn });

            if (activeGameData.flipped.length === 2) {
                const [first, second] = activeGameData.flipped;
                if (first.icon === second.icon) {
                    first.btn.classList.add('matched');
                    second.btn.classList.add('matched');
                    activeGameData.matched++;
                    activeGameData.flipped = [];

                    if (activeGameData.matched >= activeGameData.totalPairs) {
                        activeGameData.solved = true;
                        document.getElementById('puzzleFeedback').textContent = "🎉 Memory gelöst!";
                        document.getElementById('puzzleFeedback').className = "text-xs font-semibold mb-4 text-emerald-400";
                    }
                } else {
                    setTimeout(() => {
                        first.btn.querySelector('.cover-span').classList.remove('hidden');
                        first.btn.querySelector('.icon-span').classList.add('hidden');
                        second.btn.querySelector('.cover-span').classList.remove('hidden');
                        second.btn.querySelector('.icon-span').classList.add('hidden');
                        first.btn.classList.remove('bg-sky-950', 'border-sky-400');
                        second.btn.classList.remove('bg-sky-950', 'border-sky-400');
                        activeGameData.flipped = [];
                    }, 800);
                }
            }
        }

        // Sequence Helper
        function pressSequenceSymbol(sym) {
            activeGameData.userSeq.push(sym);
            const idx = activeGameData.userSeq.length - 1;

            if (activeGameData.userSeq[idx] !== activeGameData.seq[idx]) {
                document.getElementById('puzzleFeedback').textContent = "❌ Falsche Reihenfolge! Versuche es nochmal.";
                document.getElementById('puzzleFeedback').className = "text-xs font-semibold mb-4 text-rose-400";
                activeGameData.userSeq = [];
                return;
            }

            if (activeGameData.userSeq.length === activeGameData.seq.length) {
                activeGameData.solved = true;
                document.getElementById('puzzleFeedback').textContent = "🎉 Muster perfekt nachgemacht!";
                document.getElementById('puzzleFeedback').className = "text-xs font-semibold mb-4 text-emerald-400";
            }
        }

        // Check overall puzzle submission
        function checkCurrentGameAnswer() {
            const item = calendarData.find(d => d.day === activeDayForModal);
            if (!item) return;

            let isCorrect = false;

            if (item.gameType === 'quiz') {
                const val = document.getElementById('quizInput')?.value.trim().toUpperCase();
                isCorrect = (val === item.answer.trim().toUpperCase());
            } else if (item.gameType === 'unscramble') {
                isCorrect = (activeGameData.userWord.join('').toUpperCase() === item.answer.toUpperCase());
            } else if (activeGameData.solved) {
                isCorrect = true;
            }

            if (isCorrect) {
                item.unlocked = true;
                saveCalendarData();

                closePuzzleModal();
                setTimeout(() => {
                    openRewardModalDirect(item.day, true);
                }, 300);
            } else {
                document.getElementById('puzzleFeedback').textContent = "❌ Noch nicht richtig! Versuche es gleich nochmal.";
                document.getElementById('puzzleFeedback').className = "text-xs font-semibold mb-4 text-rose-400";
            }
        }

        function closePuzzleModal() {
            const modal = document.getElementById('puzzleModal');
            const modalContent = document.getElementById('puzzleModalContent');

            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Direct Reward Modal
        function openRewardModalDirect(day, triggerParticles = true) {
            const item = calendarData.find(d => d.day === day);
            if (!item) return;

            activeDayForModal = day;

            document.getElementById('modalDayNumber').textContent = `Türchen Tag ${item.day}`;
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalMessage').textContent = item.message;

            updateModalRedeemStatusUI(item.redeemed);

            const modal = document.getElementById('rewardModal');
            const modalContent = document.getElementById('rewardModalContent');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            if (triggerParticles) {
                playChimeSound();
                spawnCelebrationParticles();
            }
        }

        function updateModalRedeemStatusUI(isRedeemed) {
            const btn = document.getElementById('modalRedeemBtn');
            const btnText = document.getElementById('modalRedeemBtnText');
            const statusTag = document.getElementById('modalStatusTag');

            if (isRedeemed) {
                btn.className = "w-full py-3.5 px-6 rounded-2xl bg-sky-950/60 hover:bg-sky-900/60 text-sky-300 font-semibold text-sm border border-sky-800/40 transition-all flex items-center justify-center gap-2";
                btnText.textContent = "Als 'Offen' markieren";
                statusTag.classList.remove('hidden');
            } else {
                btn.className = "w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold text-sm shadow-lg transition-all flex items-center justify-center gap-2";
                btnText.textContent = "Als 'Eingelöst' markieren";
                statusTag.classList.add('hidden');
            }
        }

        function toggleRedeemCurrentDay() {
            if (!activeDayForModal) return;
            const item = calendarData.find(d => d.day === activeDayForModal);
            if (item) {
                item.redeemed = !item.redeemed;
                saveCalendarData();
                updateModalRedeemStatusUI(item.redeemed);
            }
        }

        function closeRewardModal() {
            const modal = document.getElementById('rewardModal');
            const modalContent = document.getElementById('rewardModalContent');

            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                activeDayForModal = null;
            }, 300);
        }

        // Particle Animation (Blue Glitters, Stars & Hearts)
        function spawnCelebrationParticles() {
            const symbols = ['🌺', '✨', '⭐', '💙', '🧪', '❄️'];
            const container = document.body;

            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'celebration-particle';
                particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                
                const startX = Math.random() * window.innerWidth;
                const size = Math.random() * 20 + 16;
                const duration = Math.random() * 2 + 2.5;

                particle.style.left = `${startX}px`;
                particle.style.bottom = `-20px`;
                particle.style.fontSize = `${size}px`;
                particle.style.animationDuration = `${duration}s`;

                container.appendChild(particle);

                setTimeout(() => { particle.remove(); }, duration * 1000);
            }
        }

        function updateStats() {
            const unlocked = calendarData.filter(d => d.unlocked).length;
            const redeemed = calendarData.filter(d => d.redeemed).length;

            document.getElementById('unlockedCount').textContent = unlocked;
            document.getElementById('redeemedCount').textContent = redeemed;
        }

        function switchTab(tab) {
            const tabMain = document.getElementById('tabMain');
            const tabHistory = document.getElementById('tabHistory');
            const btnMain = document.getElementById('navMainBtn');
            const btnHistory = document.getElementById('navHistoryBtn');

            if (tab === 'main') {
                tabMain.classList.remove('hidden');
                tabHistory.classList.add('hidden');

                btnMain.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-sky-500 text-white shadow-md shadow-sky-500/20";
                btnHistory.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300";
            } else {
                tabMain.classList.add('hidden');
                tabHistory.classList.remove('hidden');

                btnHistory.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-sky-500 text-white shadow-md shadow-sky-500/20";
                btnMain.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300";
            }
        }

        // ADMIN PANEL LOGIC
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            if (isAdminLoggedIn) {
                showAdminPanel();
            } else {
                document.getElementById('adminAuthSection').classList.remove('hidden');
                document.getElementById('adminPanelContent').classList.add('hidden');
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            const err = document.getElementById('adminAuthErr');

            if (pass === ADMIN_PIN) {
                isAdminLoggedIn = true;
                err.classList.add('hidden');
                showAdminPanel();
            } else {
                err.classList.remove('hidden');
            }
        }

        function showAdminPanel() {
            document.getElementById('adminAuthSection').classList.add('hidden');
            document.getElementById('adminPanelContent').classList.remove('hidden');
            document.getElementById('adminPanelContent').classList.add('flex');
            renderAdminDaysList();
        }

        function renderAdminDaysList() {
            const list = document.getElementById('adminDaysList');
            list.innerHTML = '';

            calendarData.forEach((item) => {
                const row = document.createElement('div');
                row.className = "bg-slate-950 p-4 rounded-2xl border border-sky-900/40 space-y-3";

                row.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-sky-900/30">
                        <span class="text-sm font-bold text-sky-300">Türchen Tag ${item.day}</span>
                        <div class="flex items-center space-x-3 text-xs">
                            <label class="flex items-center space-x-1 cursor-pointer">
                                <input type="checkbox" id="admin_unlock_${item.day}" ${item.unlocked ? 'checked' : ''} class="rounded bg-slate-900 border-sky-800 text-sky-500">
                                <span class="text-gray-300">Freigeschaltet</span>
                            </label>
                            <label class="flex items-center space-x-1 cursor-pointer">
                                <input type="checkbox" id="admin_redeem_${item.day}" ${item.redeemed ? 'checked' : ''} class="rounded bg-slate-900 border-sky-800 text-emerald-500">
                                <span class="text-gray-300">Eingelöst</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Code</label>
                            <input type="text" id="admin_code_${item.day}" value="${item.code}" maxlength="5" class="w-full bg-slate-900 border border-sky-900 rounded-xl px-3 py-1.5 text-xs font-mono text-sky-300 uppercase">
                        </div>
                        <div>
                            <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Titel / Gutschein</label>
                            <input type="text" id="admin_title_${item.day}" value="${item.title}" class="w-full bg-slate-900 border border-sky-900 rounded-xl px-3 py-1.5 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Antwort / Lösung</label>
                            <input type="text" id="admin_ans_${item.day}" value="${item.answer}" class="w-full bg-slate-900 border border-sky-900 rounded-xl px-3 py-1.5 text-xs text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Geschenk / Nachricht</label>
                        <textarea id="admin_msg_${item.day}" rows="2" class="w-full bg-slate-900 border border-sky-900 rounded-xl p-2 text-xs text-sky-100 resize-none">${item.message}</textarea>
                    </div>
                `;

                list.appendChild(row);
            });
        }

        function saveAdminChanges() {
            calendarData.forEach(item => {
                const codeInput = document.getElementById(`admin_code_${item.day}`);
                const titleInput = document.getElementById(`admin_title_${item.day}`);
                const ansInput = document.getElementById(`admin_ans_${item.day}`);
                const msgInput = document.getElementById(`admin_msg_${item.day}`);
                const unlockInput = document.getElementById(`admin_unlock_${item.day}`);
                const redeemInput = document.getElementById(`admin_redeem_${item.day}`);

                if (codeInput) item.code = codeInput.value.trim().toUpperCase();
                if (titleInput) item.title = titleInput.value.trim();
                if (ansInput) item.answer = ansInput.value.trim();
                if (msgInput) item.message = msgInput.value.trim();
                if (unlockInput) item.unlocked = unlockInput.checked;
                if (redeemInput) item.redeemed = redeemInput.checked;
            });

            saveCalendarData();

            const feedback = document.getElementById('adminFeedback');
            feedback.textContent = "⚡ Live auf allen Geräten aktualisiert!";
            setTimeout(() => { feedback.textContent = ''; }, 3000);
        }

        function massUnlock(status) {
            calendarData.forEach(item => { item.unlocked = status; });
            saveCalendarData();
        }

        function resetAllToDefaults() {
            calendarData = DEFAULT_CALENDAR_DATA.map(d => ({ ...d }));
            saveCalendarData();
        }

        // Background Star/Snow Canvas Effect
        function initStarCanvas() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const stars = Array.from({ length: 50 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2 + 1,
                d: Math.random() * 0.8 + 0.3
            }));

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(56, 189, 248, 0.7)";
                ctx.beginPath();
                for (let s of stars) {
                    ctx.moveTo(s.x, s.y);
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2, true);
                }
                ctx.fill();

                for (let s of stars) {
                    s.y += s.d;
                    if (s.y > canvas.height) {
                        s.y = -10;
                        s.x = Math.random() * canvas.width;
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
