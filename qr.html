<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMAS QR-Überraschung ❤️</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stitch: {
                            400: '#38bdf8',
                            500: '#0284c7',
                            950: '#082f49',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
        }

        .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative p-4">

    <!-- Sternen-Himmel Canvas -->
    <canvas id="starCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-60"></canvas>

    <!-- ANZEIGE FÜR DEN GESCANNTEN QR CODE -->
    <main class="relative z-10 w-full max-w-lg mx-auto my-auto">
        
        <div id="cardContainer" class="glass-card rounded-3xl p-6 sm:p-10 text-center relative shadow-2xl shadow-sky-950/80 border-2 border-sky-400/40 transform transition-all duration-500 scale-95 opacity-0">
            
            <!-- Glow background effects -->
            <div class="absolute -top-16 -left-16 w-32 h-32 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -right-16 w-32 h-32 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="inline-flex items-center space-x-1.5 px-3.5 py-1 rounded-full bg-sky-500/20 border border-sky-400/40 text-sky-300 text-xs font-semibold mb-4">
                <span>🌺 Dustins Überraschung 🌺</span>
            </div>

            <h1 id="qrTitle" class="font-display text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-300 via-sky-100 to-pink-300 mb-2">
                Türchen wird geladen...
            </h1>

            <p id="qrCategory" class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-6">
                ---
            </p>

            <!-- Textfeld Mittig & Umrandet -->
            <div class="bg-slate-950/80 border border-sky-800/70 rounded-2xl p-6 sm:p-8 shadow-inner text-center relative overflow-hidden">
                <p id="qrMessage" class="text-base sm:text-lg text-sky-100 leading-relaxed font-medium italic">
                    Bitte scanne einen QR-Code aus deinem Adventskalender!
                </p>
            </div>

            <div class="mt-6 text-[11px] text-sky-300/60 font-medium">
                XMAS 2026 ❤️
            </div>
        </div>

    </main>

    <!-- ADMIN GEAR BUTTON -->
    <button 
        onclick="openAdminModal()" 
        class="fixed bottom-4 right-4 z-40 w-11 h-11 rounded-2xl bg-slate-900/90 border border-sky-800/80 text-sky-300 hover:text-white hover:border-sky-400 flex items-center justify-center shadow-lg backdrop-blur-md transition-all hover:scale-105 active:scale-95"
        title="QR Admin Panel"
    >
        <i class="fa-solid fa-gear text-lg"></i>
    </button>

    <!-- MODAL: QR ADMIN PANEL -->
    <div id="adminModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden">
        <div class="glass-card rounded-3xl max-w-3xl w-full p-6 border border-sky-500/40 relative shadow-2xl max-h-[90vh] flex flex-col">
            
            <div class="flex items-center justify-between pb-4 border-b border-sky-900/50 mb-4">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-qrcode text-sky-400 text-lg"></i>
                    <h3 class="font-display font-bold text-lg text-white">QR-Codes Verwaltung (Türchen 1 - 23)</h3>
                </div>
                <button onclick="closeAdminModal()" class="w-8 h-8 rounded-xl bg-slate-900 text-gray-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- PIN Auth Form -->
            <div id="adminAuthSection" class="py-8 text-center space-y-4">
                <p class="text-xs text-sky-200/80">Gib den Admin-PIN ein:</p>
                <input type="password" id="adminPassInput" placeholder="PIN" maxlength="4" class="bg-slate-950 border border-sky-800 rounded-xl px-4 py-2 text-center text-lg tracking-widest text-white outline-none focus:border-sky-400">
                <div>
                    <button onclick="checkAdminPass()" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl text-xs transition-colors shadow-md">
                        Anmelden
                    </button>
                </div>
                <p id="adminAuthErr" class="text-xs text-rose-400 hidden">Falscher PIN!</p>
            </div>

            <!-- Admin Panel Content -->
            <div id="adminPanelContent" class="hidden flex-col flex-grow overflow-hidden space-y-4">
                <div class="flex items-center justify-between p-3 bg-slate-950/60 rounded-2xl border border-sky-900/30">
                    <button onclick="saveAdminChanges()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Live Speichern
                    </button>
                    <span id="adminFeedback" class="text-xs font-medium text-emerald-400 min-h-[16px]"></span>
                </div>

                <div class="flex-grow overflow-y-auto pr-2 space-y-3">
                    <div id="adminQrList" class="space-y-3">
                        <!-- Wird per JS dynamisch aufgebaut -->
                    </div>
                </div>

                <div class="pt-3 border-t border-sky-900/40 flex justify-between items-center">
                    <span class="text-xs text-gray-500">PIN: <code class="text-sky-400">1337</code></span>
                    <button onclick="closeAdminModal()" class="px-6 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold rounded-xl">
                        Schließen
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const ADMIN_PIN = "1337";

        const firebaseConfig = {
            apiKey: "AIzaSyA3wLoh9_Hmf-9vbBjI49sU7gVjbkLQcWA",
            authDomain: "xmas2026-c0eba.firebaseapp.com",
            projectId: "xmas2026-c0eba",
            storageBucket: "xmas2026-c0eba.firebasestorage.app",
            messagingSenderId: "653884262259",
            appId: "1:653884262259:web:84ce6e2633ccccbde22706",
            databaseURL: "https://xmas2026-c0eba-default-rtdb.europe-west1.firebasedatabase.app"
        };

        let dbRef = null;
        let qrData = [];
        let isAdminLoggedIn = false;

        window.addEventListener('DOMContentLoaded', () => {
            initFirebaseSync();
            initStarCanvas();
        });

        function initFirebaseSync() {
            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    dbRef = firebase.database().ref('qr_doors');

                    dbRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && Array.isArray(data) && data.length > 0) {
                            qrData = data;
                        } else {
                            // Standard-Daten für 23 QR Türchen generieren
                            qrData = Array.from({ length: 23 }, (_, i) => ({
                                door: i + 1,
                                title: `Türchen Tag ${i + 1}`,
                                category: "Gutschein",
                                text: `Hier ist deine Nachricht für Tag ${i + 1}! ❤️`
                            }));
                            dbRef.set(qrData);
                        }
                        
                        loadQrContentFromURL();
                        if (isAdminLoggedIn) renderAdminQrList();
                    });
                }
            } catch(e) {
                console.warn("Firebase Init Error:", e);
            }
        }

        function loadQrContentFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const doorNum = parseInt(urlParams.get('door') || urlParams.get('tag') || urlParams.get('tuer'), 10);

            const card = document.getElementById('cardContainer');
            const titleElem = document.getElementById('qrTitle');
            const catElem = document.getElementById('qrCategory');
            const msgElem = document.getElementById('qrMessage');

            if (doorNum >= 1 && doorNum <= 23) {
                const item = qrData.find(d => d.door === doorNum) || {
                    door: doorNum,
                    title: `Türchen Tag ${doorNum}`,
                    category: "Gutschein",
                    text: "Noch keine Nachricht hinterlegt."
                };

                titleElem.textContent = item.title;
                catElem.textContent = item.category || "Gutschein";
                msgElem.textContent = item.text;
            } else {
                titleElem.textContent = "Adventskalender QR-Scan";
                catElem.textContent = "Info";
                msgElem.textContent = "Bitte scanne einen der 23 QR-Codes auf deinen Adventskalender-Schachteln! ❤️";
            }

            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 100);
        }

        // ADMIN FUNCTIONS
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            if (isAdminLoggedIn) {
                showAdminPanel();
            } else {
                document.getElementById('adminAuthSection').classList.remove('hidden');
                document.getElementById('adminPanelContent').classList.add('hidden');
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            const err = document.getElementById('adminAuthErr');

            if (pass === ADMIN_PIN) {
                isAdminLoggedIn = true;
                err.classList.add('hidden');
                showAdminPanel();
            } else {
                err.classList.remove('hidden');
            }
        }

        function showAdminPanel() {
            document.getElementById('adminAuthSection').classList.add('hidden');
            document.getElementById('adminPanelContent').classList.remove('hidden');
            document.getElementById('adminPanelContent').classList.add('flex');
            renderAdminQrList();
        }

        function renderAdminQrList() {
            const list = document.getElementById('adminQrList');
            list.innerHTML = '';

            const baseUrl = window.location.origin + window.location.pathname;

            qrData.forEach((item) => {
                const doorUrl = `${baseUrl}?door=${item.door}`;
                const row = document.createElement('div');
                row.className = "bg-slate-950 p-4 rounded-2xl border border-sky-900/40 space-y-2";

                row.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-sky-900/30">
                        <span class="text-sm font-bold text-sky-300">QR Türchen Tag ${item.door}</span>
                        <span class="text-[10px] text-gray-400 font-mono select-all bg-slate-900 px-2 py-1 rounded border border-sky-900">
                            ${doorUrl}
                        </span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Titel</label>
                            <input type="text" id="qr_title_${item.door}" value="${item.title}" class="w-full bg-slate-900 border border-sky-900 rounded-xl px-3 py-1.5 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Kategorie</label>
                            <input type="text" id="qr_cat_${item.door}" value="${item.category || ''}" class="w-full bg-slate-900 border border-sky-900 rounded-xl px-3 py-1.5 text-xs text-sky-300">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-sky-200/60 uppercase font-bold mb-1">Text auf der Seite (Mittig angezeigt)</label>
                        <textarea id="qr_text_${item.door}" rows="2" class="w-full bg-slate-900 border border-sky-900 rounded-xl p-2 text-xs text-sky-100 resize-none">${item.text}</textarea>
                    </div>
                `;

                list.appendChild(row);
            });
        }

        function saveAdminChanges() {
            qrData.forEach(item => {
                const titleInput = document.getElementById(`qr_title_${item.door}`);
                const catInput = document.getElementById(`qr_cat_${item.door}`);
                const textInput = document.getElementById(`qr_text_${item.door}`);

                if (titleInput) item.title = titleInput.value.trim();
                if (catInput) item.category = catInput.value.trim();
                if (textInput) item.text = textInput.value.trim();
            });

            if (dbRef) {
                dbRef.set(qrData).then(() => {
                    const feedback = document.getElementById('adminFeedback');
                    feedback.textContent = "⚡ Gespeichert!";
                    loadQrContentFromURL();
                    setTimeout(() => { feedback.textContent = ''; }, 3000);
                });
            }
        }

        function initStarCanvas() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const stars = Array.from({ length: 45 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2 + 1,
                d: Math.random() * 0.7 + 0.2
            }));

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(56, 189, 248, 0.6)";
                ctx.beginPath();
                for (let s of stars) {
                    ctx.moveTo(s.x, s.y);
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2, true);
                }
                ctx.fill();

                for (let s of stars) {
                    s.y += s.d;
                    if (s.y > canvas.height) {
                        s.y = -10;
                        s.x = Math.random() * canvas.width;
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
